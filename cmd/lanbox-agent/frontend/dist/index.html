<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lanbox</title>
<script src="/theme-boot.js"></script>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<!-- ============ 登录 ============ -->
<section id="login-view" class="login" hidden>
  <div class="login-bg" aria-hidden="true"></div>
  <div class="login-card">
    <div class="login-head">
      <div class="brand brand-lg">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">lanbox</span>
      </div>
      <p class="hint center">局域网文件与消息 · Windows 客户端</p>
    </div>

    <div class="row gap login-discover">
      <button id="discover-btn" class="btn btn-sm">发现局域网服务器</button>
      <span id="discover-status" class="hint"></span>
    </div>
    <ul id="found-list" class="found"></ul>

    <label class="field">
      <span class="field-label">服务器地址</span>
      <input id="url" type="text" placeholder="https://lanbox.local" spellcheck="false">
    </label>
    <div class="row gap">
      <button id="probe-btn" class="btn btn-sm">获取证书指纹</button>
      <code id="fp-label" class="hint mono">未获取</code>
    </div>
    <label class="check">
      <input id="trust" type="checkbox">
      <span>信任该证书指纹（自签证书需要；从发现列表选择时会自动填入）</span>
    </label>

    <div class="field">
      <label class="field-label" for="username">用户名</label>
      <input id="username" type="text" autocomplete="username" spellcheck="false" autocapitalize="off">
    </div>
    <div class="field">
      <label class="field-label" for="password">密码</label>
      <span class="field-control">
        <input id="password" type="password" autocomplete="current-password">
        <button id="toggle-password" class="btn btn-icon field-toggle" type="button"
                aria-label="显示密码" aria-pressed="false" title="显示密码">
          <span class="icon" data-icon="eye"></span>
        </button>
      </span>
    </div>
    <p id="login-caps" class="hint login-caps" hidden>大写锁定已开启</p>
    <label class="check">
      <input id="remember" type="checkbox" checked>
      <span>记住密码（DPAPI 加密，仅当前用户可解密）</span>
    </label>

    <button id="login-btn" class="btn btn-primary btn-block login-submit">登录</button>
    <p id="login-err" class="err" role="alert" aria-live="assertive"></p>
    <p class="hint login-tip">已在本机用过 <code>lanbox-cli</code> 登录的话，客户端会直接复用同一个会话。</p>
  </div>
</section>

<!-- ============ 主界面 ============ -->
<section id="main-view" hidden>
  <header class="topbar">
    <div class="brand">
      <span id="status-dot" class="dot"></span>
      <span class="brand-name">lanbox</span>
    </div>
    <span id="server-label">未登录</span>
    <span id="user-label"></span>
    <span id="version-label"></span>
    <div class="topbar-actions">
      <button id="theme-btn" class="btn btn-sm btn-icon" title="外观" aria-haspopup="menu" aria-expanded="false"><span class="icon" data-icon="palette"></span></button>
      <button id="pause-btn" class="btn btn-sm">暂停</button>
      <button id="logout-btn" class="btn btn-sm btn-ghost" title="退出登录">退出</button>
    </div>
  </header>

  <nav class="tabs">
    <button id="tab-records" class="tab active" data-tab="records">记录</button>
    <button id="tab-settings" class="tab" data-tab="settings">设置</button>
  </nav>

  <main id="pane-records" class="pane">
    <div class="composer">
      <textarea id="msg" class="composer-input" placeholder="写点什么（支持 Markdown），或选文件…（Ctrl+Enter 发送）"></textarea>
      <div id="composer-preview" class="composer-preview" hidden></div>
      <div class="composer-bar">
        <button id="pick-files-btn" class="btn btn-icon" type="button" title="选择文件" aria-label="选择文件">
          <span class="icon" data-icon="paperclip"></span>
        </button>
        <button id="pick-folder-btn" class="btn btn-icon" type="button" title="选择文件夹" aria-label="选择文件夹">
          <span class="icon" data-icon="folder"></span>
        </button>
        <button id="btn-md-preview" class="btn btn-icon" type="button" title="Markdown 预览"
                aria-label="Markdown 预览" aria-pressed="false">
          <span class="icon" data-icon="eye"></span>
        </button>
        <span class="spacer"></span>
        <button id="send-btn" class="btn btn-primary">发送</button>
      </div>
      <div class="composer-bar">
        <span id="picked-label" class="hint"></span>
        <span class="spacer"></span>
        <span class="hint">可拖拽文件/文件夹到窗口</span>
      </div>
    </div>

    <div class="list-head">
      <span class="label">本机上传记录</span>
      <span id="queue-label" class="hint"></span>
    </div>
    <ul id="records" class="records"></ul>
    <p id="records-empty" class="hint center">还没有上传记录</p>
  </main>

  <main id="pane-settings" class="pane" hidden>
    <section class="card">
      <h2>剪贴板</h2>
      <p class="hint">关闭监听或暂停后，客户端完全不读取剪贴板。</p>
      <label class="check"><input id="set-enabled" type="checkbox"><span>启用剪贴板自动上传（总开关）</span></label>
      <label class="check"><input id="set-text" type="checkbox"><span>文本</span></label>
      <label class="check"><input id="set-files" type="checkbox"><span>文件 / 文件夹</span></label>
      <label class="check"><input id="set-images" type="checkbox"><span>图片（截图自动转 PNG）</span></label>

      <div class="grid">
        <label class="field"><span class="field-label">去重窗口（秒，0 = 不去重）</span>
          <input id="set-dedupe" type="number" min="0" max="3600"></label>
        <label class="field"><span class="field-label">文本上限（KB）</span>
          <input id="set-max-text" type="number" min="1"></label>
        <label class="field"><span class="field-label">图片上限（MB）</span>
          <input id="set-max-image" type="number" min="1"></label>
        <label class="field"><span class="field-label">单条总大小上限（MB）</span>
          <input id="set-max-total" type="number" min="1"></label>
        <label class="field"><span class="field-label">单条文件数量上限</span>
          <input id="set-max-files" type="number" min="1"></label>
        <label class="field"><span class="field-label">历史条数</span>
          <input id="set-history" type="number" min="5" max="200"></label>
      </div>
      <label class="field"><span class="field-label">自动上传时附加的说明前缀（留空表示原样上传）</span>
        <input id="set-prefix" type="text" placeholder="例如：📋 来自台式机"></label>

      <h2>应用</h2>
      <label class="check"><input id="set-autostart" type="checkbox"><span>开机自启（写入 HKCU\...\Run）</span></label>
      <label class="check"><input id="set-close-tray" type="checkbox"><span>关闭窗口时最小化到托盘（继续自动上传）</span></label>
      <label class="check"><input id="set-remember" type="checkbox"><span>记住密码（会话过期时自动重新登录）</span></label>

      <div class="row gap" style="margin-top: var(--space-3)">
        <button id="save-settings-btn" class="btn btn-primary">保存设置</button>
        <button id="open-log-btn" class="btn btn-sm">打开日志</button>
        <button id="open-data-btn" class="btn btn-sm">打开配置目录</button>
        <span id="settings-status" class="hint"></span>
      </div>
    </section>
  </main>
</section>


<div id="theme-menu" class="menu" role="menu" aria-label="外观主题" hidden>
  <button type="button" role="menuitemradio" data-theme-value="system" aria-checked="false">
    <span class="icon" data-icon="auto"></span><span>跟随系统</span><span class="icon menu-check" data-icon="check"></span>
  </button>
  <button type="button" role="menuitemradio" data-theme-value="light" aria-checked="false">
    <span class="icon" data-icon="sun"></span><span>亮色</span><span class="icon menu-check" data-icon="check"></span>
  </button>
  <button type="button" role="menuitemradio" data-theme-value="dark" aria-checked="false">
    <span class="icon" data-icon="moon"></span><span>暗色</span><span class="icon menu-check" data-icon="check"></span>
  </button>
  <button type="button" role="menuitemradio" data-theme-value="paper" aria-checked="false">
    <span class="icon" data-icon="paper"></span><span>纸张</span><span class="icon menu-check" data-icon="check"></span>
  </button>
</div>

<div id="toast" class="toast" hidden></div>
<div id="dialog-root" class="mask" hidden></div>
<div id="drop-overlay" class="drop-overlay" hidden><span>松开鼠标即可上传</span></div>

<script src="/icons.js"></script>
<script src="/markdown.js"></script>
<script src="/app.js"></script>
</body>
</html>
