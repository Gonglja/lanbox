<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lanbox</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<!-- ============ 登录 ============ -->
<section id="login-view" class="login" hidden>
  <div class="login-card">
    <div class="brand-lg">
      <span class="logo"></span>
      <span>lanbox</span>
    </div>
    <p class="muted center">局域网文件与消息 · Windows 客户端</p>

    <div class="row gap">
      <button id="discover-btn" class="btn">发现局域网服务器</button>
      <span id="discover-status" class="muted small"></span>
    </div>
    <ul id="found-list" class="found"></ul>

    <label class="field">
      <span>服务器地址</span>
      <input id="url" type="text" placeholder="https://lanbox.local 或 https://192.168.1.9" spellcheck="false">
    </label>
    <div class="row gap">
      <button id="probe-btn" class="btn">获取证书指纹</button>
      <code id="fp-label" class="muted small mono">未获取</code>
    </div>
    <label class="check">
      <input id="trust" type="checkbox">
      <span>信任该证书指纹（自签证书需要；从发现列表选择时会自动填入）</span>
    </label>

    <label class="field">
      <span>用户名</span>
      <input id="username" type="text" autocomplete="username" spellcheck="false">
    </label>
    <label class="field">
      <span>密码</span>
      <input id="password" type="password" autocomplete="current-password">
    </label>
    <label class="check">
      <input id="remember" type="checkbox" checked>
      <span>记住密码（用 Windows DPAPI 加密保存，仅当前用户可解密）</span>
    </label>

    <button id="login-btn" class="btn primary wide">登录</button>
    <p id="login-err" class="err"></p>
    <p class="muted small">
      已在本机用过 <code>lanbox-cli</code> 登录的话，客户端会直接复用同一个会话，无需再次输入密码。
    </p>
  </div>
</section>

<!-- ============ 主界面 ============ -->
<section id="main-view" hidden>
  <header class="topbar">
    <div class="brand">
      <span id="status-dot" class="dot"></span>
      <span class="brand-name">lanbox</span>
      <span id="version-label" class="muted small"></span>
    </div>
    <div class="meta">
      <span id="server-label" class="muted small">未登录</span>
      <span id="user-label" class="muted small"></span>
    </div>
    <div class="row gap">
      <button id="pause-btn" class="btn small">暂停</button>
      <button id="logout-btn" class="btn small ghost">退出登录</button>
    </div>
  </header>

  <nav class="tabs">
    <button id="tab-records" class="tab active" data-tab="records">记录</button>
    <button id="tab-settings" class="tab" data-tab="settings">设置</button>
  </nav>

  <main id="pane-records" class="pane">
    <div class="card composer">
      <textarea id="msg" rows="3" placeholder="输入要发送的消息…（Ctrl+Enter 发送）"></textarea>
      <div class="row gap composer-actions">
        <button id="pick-files-btn" class="btn small">选择文件</button>
        <button id="pick-folder-btn" class="btn small">选择文件夹</button>
        <span id="picked-label" class="muted small"></span>
        <span class="spacer"></span>
        <button id="send-btn" class="btn primary">发送</button>
      </div>
      <p class="muted small">也可以把文件或文件夹直接拖进这个窗口。</p>
    </div>

    <div class="list-head">
      <span class="muted small">本机上传记录</span>
      <span id="queue-label" class="muted small"></span>
    </div>
    <ul id="records" class="records"></ul>
    <p id="records-empty" class="muted small center">还没有上传记录</p>
  </main>

  <main id="pane-settings" class="pane" hidden>
    <section class="card">
      <h2>剪贴板</h2>
      <p class="muted small">关闭监听或暂停后，客户端完全不读取剪贴板。</p>
      <label class="check"><input id="set-enabled" type="checkbox"><span>启用剪贴板自动上传（总开关）</span></label>
      <label class="check"><input id="set-text" type="checkbox"><span>文本</span></label>
      <label class="check"><input id="set-files" type="checkbox"><span>文件 / 文件夹</span></label>
      <label class="check"><input id="set-images" type="checkbox"><span>图片（截图会自动转成 PNG）</span></label>

      <div class="grid">
        <label class="field"><span>去重窗口（秒，0 = 不去重）</span>
          <input id="set-dedupe" type="number" min="0" max="3600"></label>
        <label class="field"><span>文本上限（KB）</span>
          <input id="set-max-text" type="number" min="1"></label>
        <label class="field"><span>图片上限（MB）</span>
          <input id="set-max-image" type="number" min="1"></label>
        <label class="field"><span>单条总大小上限（MB）</span>
          <input id="set-max-total" type="number" min="1"></label>
        <label class="field"><span>单条文件数量上限</span>
          <input id="set-max-files" type="number" min="1"></label>
        <label class="field"><span>历史条数</span>
          <input id="set-history" type="number" min="5" max="200"></label>
      </div>
      <label class="field"><span>自动上传时附加的说明前缀（留空表示原样上传）</span>
        <input id="set-prefix" type="text" placeholder="例如：📋 来自台式机"></label>

      <h2>应用</h2>
      <label class="check"><input id="set-autostart" type="checkbox"><span>开机自启（写入 HKCU\...\Run）</span></label>
      <label class="check"><input id="set-close-tray" type="checkbox"><span>关闭窗口时最小化到托盘（继续自动上传）</span></label>
      <label class="check"><input id="set-remember" type="checkbox"><span>记住密码（会话过期时自动重新登录）</span></label>

      <div class="row gap">
        <button id="save-settings-btn" class="btn primary">保存设置</button>
        <button id="open-log-btn" class="btn small">打开日志</button>
        <button id="open-data-btn" class="btn small">打开配置目录</button>
        <span id="settings-status" class="muted small"></span>
      </div>
    </section>
  </main>
</section>

<div id="toast" class="toast" hidden></div>
<div id="drop-overlay" class="drop-overlay" hidden><span>松开鼠标即可上传</span></div>

<script src="/app.js"></script>
</body>
</html>
