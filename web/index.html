<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lanbox · 内外网中转站</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<section id="login-view" class="centered" hidden>
  <form id="login-form" class="card login">
    <h1>lanbox</h1>
    <p class="hint">内外网共享中转站，请先登录</p>
    <label>用户名
      <input id="login-username" name="username" autocomplete="username" required autofocus>
    </label>
    <label>密码
      <input id="login-password" name="password" type="password" autocomplete="current-password" required>
    </label>
    <p id="login-error" class="error" hidden></p>
    <button type="submit" class="primary">登录</button>
  </form>
</section>

<section id="app-view" hidden>
  <header class="topbar">
    <strong class="brand">lanbox</strong>
    <span id="who" class="who"></span>
    <span id="sse-state" class="badge" title="实时连接状态">连接中…</span>
    <span class="spacer"></span>
    <button id="btn-admin" hidden>用户管理</button>
    <button id="btn-logout">登出</button>
  </header>

  <div class="wrap">
    <form id="composer" class="card">
      <textarea id="composer-text" rows="3" placeholder="输入要中转的文字…（支持拖入文件、Ctrl+V 粘贴截图）"></textarea>
      <ul id="pending-files" class="pending"></ul>
      <div class="composer-actions">
        <label class="file-btn">选择文件<input id="composer-files" type="file" multiple hidden></label>
        <span id="limit-hint" class="hint"></span>
        <span class="spacer"></span>
        <button type="submit" id="btn-send" class="primary">发送</button>
      </div>
      <div id="progress" class="progress" hidden>
        <div id="progress-bar"></div>
        <span id="progress-text"></span>
      </div>
    </form>

    <div class="toolbar">
      <button id="filter-all" class="chip active" type="button">全部</button>
      <button id="filter-todo" class="chip" type="button">未取走</button>
      <input id="search" type="search" placeholder="搜索文字或文件名">
    </div>

    <main id="items" class="items"></main>
    <div class="more"><button id="btn-more" hidden type="button">加载更多</button></div>
  </div>
</section>

<aside id="admin-drawer" class="drawer" hidden>
  <div class="drawer-head">
    <strong>用户管理</strong>
    <button id="btn-close-admin" type="button">关闭</button>
  </div>
  <form id="user-form" class="card">
    <label>用户名<input id="user-name" autocomplete="off" required></label>
    <label>密码<input id="user-pass" type="password" autocomplete="new-password" minlength="8" required></label>
    <label class="inline"><input id="user-admin" type="checkbox"> 管理员</label>
    <button type="submit" class="primary">新增用户</button>
    <p id="admin-error" class="error" hidden></p>
  </form>
  <ul id="user-list" class="users"></ul>
</aside>

<template id="tpl-item">
  <article class="card item">
    <div class="meta">
      <span class="item-user"></span>
      <span class="dot">·</span>
      <span class="item-ip"></span>
      <span class="dot">·</span>
      <time class="item-time"></time>
      <span class="spacer"></span>
      <span class="item-taken-tag" hidden>已取走</span>
    </div>
    <p class="item-text"></p>
    <ul class="files"></ul>
    <div class="item-actions">
      <button class="act-taken" type="button"></button>
      <button class="act-delete danger" type="button">删除</button>
    </div>
  </article>
</template>

<script type="module" src="/main.js"></script>
</body>
</html>
